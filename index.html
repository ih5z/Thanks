<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank You</title>
<meta name="description" content="A quiet thank you." />
<style>
  /* ---------- reset ---------- */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050505;
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, 0.55);
    --line: rgba(255, 255, 255, 0.14);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --serif: "Didot", "Bodoni MT", "Playfair Display", "Baskerville", "Hoefler Text", Georgia, "Times New Roman", serif;
    --charge: 4s;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", "Inter", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- ambient layers ---------- */
  #particles { position: fixed; inset: 0; z-index: 0; display: block; }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, rgba(255,255,255,0.055), transparent 70%),
      radial-gradient(ellipse 120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,0.85) 100%);
  }

  /* ---------- layout ---------- */
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 6vw, 64px) clamp(24px, 6vw, 64px) clamp(120px, 18vh, 160px);
    text-align: center;
  }

  .core {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 860px;
    width: 100%;
  }

  /* ---------- stagger ---------- */
  .rise {
    opacity: 0;
    transform: translateY(22px);
    animation: rise 1.15s var(--ease) forwards;
  }
  .rise.d1 { animation-delay: 0.15s; }
  .rise.d3 { animation-delay: 0.62s; }
  .rise.d4 { animation-delay: 0.85s; }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* ---------- mark ---------- */
  .mark {
    width: clamp(38px, 6vw, 52px);
    height: clamp(38px, 6vw, 52px);
    margin-bottom: clamp(22px, 4vw, 38px);
    color: rgba(255, 255, 255, 0.7);
  }
  .mark svg { width: 100%; height: 100%; display: block; }
  .mark .ring {
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    animation: draw 2.2s var(--ease) 0.5s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* ============================================================
     HEADING
     ============================================================ */
  h1 {
    font-family: var(--serif);
    font-size: clamp(4rem, 20vw, 13rem);
    font-weight: 300;
    letter-spacing: clamp(0.04em, 0.9vw, 0.14em);
    line-height: 0.9;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 0.06em clamp(0.04em, 0.9vw, 0.14em) 0.1em 0;
    color: #ffffff;
    animation: breathe 7s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(255,255,255,0.12)); }
    50%      { filter: drop-shadow(0 0 36px rgba(255,255,255,0.30)); }
  }

  .ltr {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.36em);
    filter: blur(10px);
    animation: letterIn 1.15s var(--ease) forwards;
    animation-delay: calc(0.35s + var(--i) * 0.085s);
  }

  @keyframes letterIn {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .float {
    display: inline-block;
    animation: floatY 5.2s ease-in-out infinite;
    animation-delay: calc(var(--i) * -0.62s);
  }

  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-0.045em); }
  }

  .ch {
    display: inline-block;
    background-image: linear-gradient(
      100deg,
      #ffffff 0%,
      #b6b6b6 16%,
      #ffffff 32%,
      #9d9d9d 48%,
      #ffffff 66%,
      #c6c6c6 84%,
      #f6f6f6 100%
    );
    background-size: 300% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: sweep 7.5s linear infinite;
    animation-delay: calc(var(--i) * -0.9s);
    transition: transform 0.32s var(--ease), filter 0.32s var(--ease);
    will-change: background-position, transform;
  }

  @keyframes sweep {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* ---------- rule ---------- */
  .rule {
    width: 0;
    height: 1px;
    margin: clamp(20px, 3.2vw, 32px) 0 clamp(20px, 3vw, 30px);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.42), transparent);
    animation: spread 1.6s var(--ease) 0.95s forwards;
  }
  @keyframes spread { to { width: min(320px, 66%); } }

  /* ---------- subtitle ---------- */
  p.sub {
    font-size: clamp(0.92rem, 2.6vw, 1.12rem);
    font-weight: 300;
    line-height: 1.75;
    letter-spacing: 0.02em;
    color: var(--muted);
    max-width: 44ch;
  }

  /* ============================================================
     BUTTON — press starts a 10s vertical fill, no ripple, no glow
     .fill sits behind .label; label uses mix-blend-mode: difference
     so white-on-white reads black and white-on-black reads white.
     ============================================================ */
  .actions {
    display: flex;
    justify-content: center;
    margin-top: clamp(34px, 5.5vw, 54px);
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 34px;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.34);
    border-radius: 999px;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.4s var(--ease);
  }

  .btn:focus-visible { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 3px; }

  .btn .fill {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: #ffffff;
    transform: translateY(101%);
    will-change: transform;
  }

  .btn .label {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #ffffff;
    mix-blend-mode: difference;
  }

  .btn .label svg { width: 15px; height: 15px; display: block; }

  /* 10-second charge */
  .btn.charging { pointer-events: none; }
  .btn.charging .fill {
    animation: charge var(--charge) linear forwards;
  }
  @keyframes charge {
    from { transform: translateY(101%); }
    to   { transform: translateY(0); }
  }

  /* ---------- footer ---------- */
  footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding: clamp(20px, 4vw, 30px) 20px clamp(24px, 4.6vw, 36px);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(16px);
    animation: rise 1.2s var(--ease) 1.15s forwards;
  }

  .sig,
  .credit {
    font-size: 0.66rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.46);
    padding-left: 0.3em;
    white-space: nowrap;
  }

  /* ---------- social curtain ---------- */
  .curtain {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: clamp(18px, 5vw, 40px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.45s var(--ease), visibility 0s linear 0.45s;
  }
  .curtain.open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.45s var(--ease), visibility 0s;
  }

  .curtain .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
  }

  .card {
    position: relative;
    width: min(420px, 100%);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    padding: clamp(26px, 5vw, 38px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 22px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012)),
      rgba(10, 10, 10, 0.9);
    box-shadow:
      0 30px 90px rgba(0, 0, 0, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.07);
    transform: translateY(26px) scale(0.97);
    opacity: 0;
    transition: transform 0.6s var(--ease), opacity 0.6s var(--ease);
  }
  .curtain.open .card { transform: translateY(0) scale(1); opacity: 1; }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
  }

  .close {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 50%;
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    transition: color 0.35s var(--ease), border-color 0.35s var(--ease), transform 0.35s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .close:hover, .close:focus-visible {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.45);
    transform: rotate(90deg);
    outline: none;
  }
  .close svg { width: 13px; height: 13px; }

  .card-note {
    font-size: 0.76rem;
    font-weight: 300;
    letter-spacing: 0.03em;
    color: rgba(255, 255, 255, 0.34);
    margin-bottom: clamp(18px, 3.4vw, 26px);
  }

  .links { display: flex; flex-direction: column; gap: 8px; }

  .link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    padding: 15px 16px;
    font-family: inherit;
    text-align: left;
    text-decoration: none;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.022);
    border: 1px solid rgba(255, 255, 255, 0.075);
    border-radius: 14px;
    cursor: pointer;
    overflow: hidden;
    transition: background 0.4s var(--ease), border-color 0.4s var(--ease), transform 0.4s var(--ease);
    -webkit-tap-highlight-color: transparent;

    opacity: 0;
    transform: translateY(12px);
  }
  .curtain.open .link {
    animation: linkIn 0.7s var(--ease) forwards;
    animation-delay: calc(0.16s + var(--i) * 0.075s);
  }
  @keyframes linkIn { to { opacity: 1; transform: translateY(0); } }

  .link:hover, .link:focus-visible {
    background: rgba(255, 255, 255, 0.055);
    border-color: rgba(255, 255, 255, 0.24);
    transform: translateX(3px);
    outline: none;
  }

  .link .ico {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: #ffffff;
    border-radius: 11px;
    transition: transform 0.4s var(--ease);
  }
  .link:hover .ico, .link:focus-visible .ico { transform: scale(1.06); }
  .link .ico svg { width: 21px; height: 21px; display: block; fill: #000000; }

  .link .platform {
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.88);
  }

  .link .tail {
    margin-left: auto;
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    color: rgba(255, 255, 255, 0.3);
    transition: color 0.4s var(--ease), transform 0.4s var(--ease);
  }
  .link .tail svg { width: 13px; height: 13px; }
  .link:hover .tail, .link:focus-visible .tail {
    color: rgba(255, 255, 255, 0.9);
    transform: translate(2px, -2px);
  }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .rise, .rule, .mark .ring, footer {
      animation: none; opacity: 1; transform: none; stroke-dashoffset: 0;
    }
    .rule { width: min(320px, 66%); }
    h1 { animation: none; }
    .ltr { animation: none; opacity: 1; transform: none; filter: none; }
    .float { animation: none; }
    .ch { animation: none; background: none; color: #fff; -webkit-text-fill-color: #fff; }
    .curtain.open .link { animation: none; opacity: 1; transform: none; }
    #particles { display: none; }
    * { transition-duration: 0.01ms !important; }
  }

  /* ---------- small screens ---------- */
  @media (max-width: 420px) {
    .btn { padding: 14px 26px; font-size: 0.7rem; letter-spacing: 0.14em; }
    .link { padding: 13px 14px; gap: 12px; }
    .link .ico { width: 36px; height: 36px; border-radius: 10px; }
    .link .ico svg { width: 19px; height: 19px; }
    .link .platform { font-size: 0.72rem; letter-spacing: 0.18em; }
    .sig, .credit { font-size: 0.6rem; letter-spacing: 0.22em; }
  }
</style>
</head>

          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>

    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CHARGE_MS = 10000;

  /* ============================================================
     HEADING
     ============================================================ */
  const title = document.getElementById("title");
  const word = "THANKS";
  const letters = [];

  title.textContent = "";
  word.split("").forEach((ch, i) => {
    const ltr = document.createElement("span");
    ltr.className = "ltr";
    ltr.style.setProperty("--i", i);
    ltr.setAttribute("aria-hidden", "true");

    const float = document.createElement("span");
    float.className = "float";
    float.style.setProperty("--i", i);

    const glyph = document.createElement("span");
    glyph.className = "ch";
    glyph.style.setProperty("--i", i);
    glyph.textContent = ch;

    float.appendChild(glyph);
    ltr.appendChild(float);
    title.appendChild(ltr);
    letters.push(glyph);
  });

  /* ============================================================
     CURSOR PROXIMITY
     ============================================================ */
  if (!reduceMotion) {
    let ready = false;
    let mx = -9999, my = -9999;
    let ticking = false;
    let baseRects = [];

    function cacheRects() {
      baseRects = letters.map((el) => {
        const r = el.getBoundingClientRect();
        return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
      });
    }

    function update() {
      ticking = false;
      if (!ready) return;

      for (let i = 0; i < letters.length; i++) {
        const b = baseRects[i];
        if (!b) continue;

        const dx = mx - b.cx;
        const dy = my - b.cy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const radius = 150;
        let t = 1 - dist / radius;
        if (t < 0) t = 0;
        const ease = t * t * (3 - 2 * t);

        if (ease > 0.004) {
          letters[i].style.transform =
            "translateY(" + (-ease * 13).toFixed(2) + "px) scale(" + (1 + ease * 0.08).toFixed(3) + ")";
          letters[i].style.filter =
            "drop-shadow(0 0 " + (ease * 18).toFixed(1) + "px rgba(255,255,255," + (ease * 0.55).toFixed(2) + "))";
        } else {
          letters[i].style.transform = "";
          letters[i].style.filter = "";
        }
      }
    }

    function onMove(e) {
      mx = e.clientX;
      my = e.clientY;
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }

    window.addEventListener("pointermove", onMove, { passive: true });
    window.addEventListener("pointerleave", () => {
      mx = my = -9999;
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });

    window.addEventListener("resize", () => { cacheRects(); }, { passive: true });

    setTimeout(() => { cacheRects(); ready = true; }, 1450);
  }

  /* ============================================================
     PARTICLE FIELD
     ============================================================ */
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, dpr = 1;
  let particles = [];
  const pointer = { x: 0, y: 0, active: false };
  let rafId = null;

  function sizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(anywhere) {
    const depth = Math.random();
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 12,
      r: 0.6 + depth * 1.9,
      a: 0.06 + depth * 0.42,
      vx: (Math.random() - 0.5) * 0.12 * (0.4 + depth),
      vy: -(0.06 + depth * 0.34),
      tw: Math.random() * Math.PI * 2,
      twSpeed: 0.004 + Math.random() * 0.01,
      depth: depth
    };
  }

  function makeParticles() {
    const density = Math.min(120, Math.round((W * H) / 16000));
    particles = Array.from({ length: density }, () => spawn(true));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      p.x += p.vx;
      p.y += p.vy;
      p.tw += p.twSpeed;

      if (pointer.active) {
        const dx = pointer.x - p.x;
        const dy = pointer.y - p.y;
        const dist2 = dx * dx + dy * dy;
        const range = 160 * 160;
        if (dist2 < range) {
          const force = (1 - dist2 / range) * 0.35 * (0.3 + p.depth);
          p.x += dx * force * 0.02;
          p.y += dy * force * 0.02;
        }
      }

      if (p.y < -14) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < -14) p.x = W + 10;
      if (p.x > W + 14) p.x = -10;

      const alpha = p.a * (0.55 + 0.45 * Math.sin(p.tw));

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")";
      ctx.shadowBlur = p.r * 4;
      ctx.shadowColor = "rgba(255,255,255," + (alpha * 0.5).toFixed(3) + ")";
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    rafId = requestAnimationFrame(draw);
  }

  function initCanvas() {
    sizeCanvas();
    makeParticles();
    if (!reduceMotion) draw();
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      cancelAnimationFrame(rafId);
      initCanvas();
    }, 140);
  }, { passive: true });

  window.addEventListener("pointermove", (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  }, { passive: true });

  window.addEventListener("pointerleave", () => { pointer.active = false; });

  initCanvas();

  /* ============================================================
     BUTTON — 10s fill charge, then the handles panel
     no ripple, no press highlight, no copy anywhere
     ============================================================ */
  const curtain = document.getElementById("curtain");
  const followBtn = document.getElementById("followBtn");
  let lastFocus = null;
  let charging = false;

  function openCurtain() {
    lastFocus = document.activeElement;
    curtain.classList.add("open");
    curtain.setAttribute("aria-hidden", "false");
    followBtn.setAttribute("aria-expanded", "true");
    const first = curtain.querySelector(".close");
    if (first) first.focus({ preventScroll: true });
  }

  function closeCurtain() {
    curtain.classList.remove("open");
    curtain.setAttribute("aria-hidden", "true");
    followBtn.setAttribute("aria-expanded", "false");
    followBtn.classList.remove("charging");
    charging = false;
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  followBtn.setAttribute("aria-expanded", "false");

  followBtn.addEventListener("click", () => {
    if (charging) return;
    charging = true;
    followBtn.classList.add("charging");
    // animationend on the fill fires when the 10s charge completes
  });

  followBtn.querySelector(".fill").addEventListener("animationend", () => {
    if (!charging) return;
    openCurtain();
  });

  curtain.querySelectorAll("[data-close]").forEach((el) => {
    el.addEventListener("click", closeCurtain);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && curtain.classList.contains("open")) closeCurtain();
  });
})();
</script>
